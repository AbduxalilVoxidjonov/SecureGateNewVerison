<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <!--
      Qat'iy CSP — on-prem xavfsizlik tizimi uchun tashqi manbalar taqiqlanadi.
      Eslatma: bu meta faqat qo'shimcha qatlam; ishonchli himoya uchun server
      (nginx/Kestrel) ham shu sarlavhani yuborishi kerak.
      DIQQAT: `npm run dev` (Vite HMR) inline skript ishlatadi — dev rejimda bu
      CSP HMR'ni bloklaydi. Prod build (`npm run build`/`preview`) toza ishlaydi.
    -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SecureGate — IP Camera & Access Control</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
